  /user/history:
    get:
      tags:
      - User
      operationId: userHistory
      summary: Get History
      description: User activity log about things like forms created/modified/deleted, account logins and other
        operations.
      externalDocs:
        url: https://api.jotform.com/docs/#user-history
      parameters:
      - name: action
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - userCreation
          - userLogin
          - formCreation
          - formUpdate
          - formDelete
          - formPurge
        description: Filter results by activity performed. Default is 'all'.
        example: userLogin
      - name: date
        in: query
        required: false
        schema:
          type: string
          enum:
          - lastWeek
          - lastMonth
          - last3Months
          - last6Months
          - lastYear
          - all
        description: Limit results by a date range. If you'd like to limit results by specific dates you can use
          startDate and endDate fields **instead**.
        example: lastWeek
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
          enum:
          - ASC
          - DESC
        description: Lists results by ascending and descending order
        example: ASC
      - name: startDate
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 'Limit results to only after a specific date.  Format: MM/DD/YYYY.'
        example: 01/31/2013
      - name: endDate
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 'Limit results to only before a specific date. Format: MM/DD/YYYY.'
        example: 12/31/2013
      responses:
        '200':
          description: |-
            - **type** can be userCreation, userLogin, formCreation, formUpdate, formDelete or formPurge.
            - **timestamp** is number of seconds since Jan 1st, 1970.
            - **limit-left** is the number of daily api calls you can make.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                responseCode: 200
                message: success
                content:
                - type: formCreation
                  formID: '31751954731962'
                  username: johnsmith
                  formTitle: Untitled Form
                  formStatus: ENABLED
                  ip: 123.123.123.123
                  timestamp: 1372145854
                limit-left: 4999
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /label/{id}:
    get:
      tags:
      - Labels
      operationId: getLabelId
      summary: Get Label Details
      description: Get the details of a label, including its name and color.
      externalDocs:
        url: https://api.jotform.com/docs/#get-label-id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Label ID
      responses:
        '200':
          description: |-
            - **id** is report ID.
            - **fields** is a comma separated list of all fields.
