  /user/forms:
    get:
      tags:
      - Forms
      operationId: userForms
      summary: Get User Forms
      description: Get a list of forms for this account. Includes basic details such as title of the form, when
        it was created, number of new and total submissions.
      externalDocs:
        url: https://api.jotform.com/docs/#user-forms
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Start of each result set for form list. Useful for pagination. Default is 0.
        example: 20
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Number of results in each result set for form list. Default is 20. Maximum is 1000.
        example: 30
      - name: filter
        in: query
        required: false
        schema:
          type: string
          description: 'JSON-encoded string. Filterable fields: id, title, created_at, status, new, updated_at'
        description: |-
          Filters the query results to fetch a specific form range.

          Example: {"new":"1"}
          You can also use gt(greater than), lt(less than), ne(not equal to) commands to get more advanced filtering :
          Example: {"created_at:gt":"2013-01-01 00:00:00"}
      - name: orderby
        in: query
        required: false
        schema:
          type: string
          enum:
          - id
          - username
          - title
          - status
          - created_at
          - updated_at
          - new
          - count
          - slug
        description: 'Order results by a form field name: id, username, title, status(ENABLED, DISABLED, DELETED),
          created_at, updated_at, new (unread submissions count), count (all submissions count), slug (used in form
          URL).'
        example: created_at
      responses:
        '200':
          description: |-
            - **id** is the Form ID
            - Form **height** in pixel. Form width can be called from /form/{formID}/properties/formWidth
            - **status** can be ENABLED, DISABLED or DELETED
            - **created_at**, **updated_at**: YYYY-MM-DD HH:MM:SS
            - **last_submission** YYYY-MM-DD HH:MM:SS
            - **new** is the total number of unread submissions
            - **count** is the total number of submissions
            - **type** can be LEGACY or CARD
            - **favorite** 1 if you add the form to your favorites otherwise 0
            - **archived** 1 if you archive the form otherwise 0
            - **offset** is start of each result set for form data.
            - **limit** is number of results in each result set for form data.
            - **count** is total number of results returned by the API
            - **limit-left** is the number of daily api calls you can make.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                responseCode: 200
                message: success
                content:
                - id: '31504059977966'
                  username: johnsmith
                  title: Contact Us
                  height: '1550'
                  status: ENABLED
                  created_at: '2013-06-24 18:43:21'
                  updated_at: '2013-06-25 19:01:52'
                  last_submission: '2013-06-25 19:04:52'
                  new: '5'
                  count: '755'
                  type: LEGACY
                  favorite: 0
                  archived: 0
                  url: http://www.jotformpro.com/form/31504059977966
                resultSet:
                  offset: 0
                  limit: 20
                  count: 20
                limit-left: 4986
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
