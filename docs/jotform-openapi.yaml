                    Or, look at the source code of the form.
                  example: john@example.com
                submission[2][first]:
                  type: string
                  description: 'Data entered in question 2. In this example the second question is a full name question.
                    So, there are two fields in this question: firstName and lastName. These fields can be found
                    by looking at the source code of the form.'
                  example: John
                submission[2][last]:
                  type: string
                  description: Data entered in the second part of question 2.
                  example: Smith
                submission[3]:
                  type: string
                  description: Data entered in question 3. (You should get a list of question IDs from form/{id}/questions)
                  example: Lorem ipsum dolor sit amet, consectetur adipisicing elit, sed do eiusmod tempor incididunt
                    ut labore et dolore magna aliqua.
              required:
              - submission[1]
      responses:
        '200':
          description: |-
            - **id** is the Submission ID
            - **limit-left** is the number of daily api calls you can make.
