paths:
  /user:
    get:
      tags:
      - User
      operationId: user
      summary: Get User Information
      description: Get user account details for this Jotform user. Including user account type, avatar URL, name,
        email, website URL.
      externalDocs:
        url: https://api.jotform.com/docs/#user
      responses:
        '200':
          description: |-
            - **username**, **name**, **email**, **website**, **avatarUrl** and **company** are basic user account details.
            - **time_zone** is in [IANA format](http://en.wikipedia.org/wiki/List_of_IANA_time_zones).
            - **account_type** list can be seen in [Pricing page](http://www.jotform.com/pricing/).
            - **status** can be ACTIVE, DELETED or SUSPENDED
            - **created_at**: YYYY-MM-DD HH:MM:SS
            - **updated_at**: YYYY-MM-DD HH:MM:SS
            - You should append API Key (or authenticate with header/cookie) to the **usage** URL to get the monthly usage details for a user.
            - **limit-left** is the number of daily api calls you can make.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                responseCode: 200
                message: success
                content:
                  username: johnsmith
                  name: John Smith
                  email: john@example.com
                  website: http://www.jotform.com
                  time_zone: America/New_York
                  account_type: http://api.jotform.com/system/plan/PREMIUM
                  status: ACTIVE
                  created_at: '2013-06-24 18:43:21'
                  updated_at: '2013-06-25 19:01:52'
                  is_verified: '1'
                  usage: http://api.jotform.com/user/usage
                  industry: Web Development
                  securityAnswer: ''
                  company: Interlogy, LLC
                  securityQuestion: ''
                  webhooks: '["http://www.example.com/instant_submission_notification.php"]'
                  doNotClone: '0'
                  folderLayout: '{"rootFolderID":{"nodes":{"folderID":{"nodes":[]},"folderID":{"nodes":[]}}}}'
                  language: en-US
                  avatarUrl: http://gravatar.com/avatar/c3308f0feb2f350cded9222f83fb9363
                limit-left: 4999
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /user/usage:
    get:
      tags:
      - User
      operationId: userUsage
      summary: Get Monthly User Usage
      description: Get number of form submissions received this month. Also, get number of SSL form submissions,
        payment form submissions and upload space used by user.
      externalDocs:
        url: https://api.jotform.com/docs/#user-usage
      responses:
        '200':
          description: |-
            - Number of **submissions** received this month
            - Number of secure submissions received this month
            - Number of payment submissions received this month
            - Total disk space used for uploaded files. In bytes.
            - Number of **mobile submissions** received this month
            - Number of form **views** received this month
            - Number of **api** calls used today.
            - **limit-left** is the number of daily api calls you can make.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                responseCode: 200
                message: success
                content:
                  submissions: '478'
                  ssl_submissions: '234'
                  payments: '35'
                  uploads: '31246868'
                  mobile_submissions: '21'
                  views: '2014'
                  api: '14'
                limit-left: 4986
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /user/submissions:
    get:
      tags:
      - Submissions
      operationId: userSubmissions
      summary: Get User Submissions
      description: Get a list of all submissions for all forms on this account. The **answers** array has the submission
        data. Created_at is the date of the submission.
      externalDocs:
        url: https://api.jotform.com/docs/#user-submissions
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Start of each result set for submission data. Useful for pagination. Default is 0.
        example: 20
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Number of results in each result set for submission data. Default is 20. Maximum is 1000.
        example: 30
      - name: filter
        in: query
        required: false
        schema:
          type: string
          description: 'JSON-encoded string. Filterable fields: id, form_id, IP, created_at, status, new, flag,
            updated_at'
        description: |-
          Filters the query results to fetch a specific submissions range.

          Example: {"new":"1"}
          You can also use gt(greater than), lt(less than), ne(not equal to), formIDs and fullText commands to get more advanced filtering :
          Example: {"created_at:gt":"2013-01-01 00:00:00"}
          Example: {"formIDs":["your-form-id","your-form-id#2"]}
          Example: {"fullText":"John Brown"}
      - name: orderby
        in: query
        required: false
        schema:
          type: string
          enum:
          - id
          - form_id
          - IP
          - created_at
          - status
          - new
          - flag
          - updated_at
        description: 'Order results by a submission field name: id, form_id, IP, created_at, status, new, flag,
          updated_at.'
        example: created_at
      responses:
        '200':
          description: |-
            - **id** is the Submission ID
            - **ip** address of the submitter
            - **created_at**, **updated_at**: YYYY-MM-DD HH:MM:SS
            - **status** can be ACTIVE or OVERQUOTA
            - **new** is 1 if this submission is not read
            - **text** is the question label on the form
            - **type** is the question type such as textbox or dropdown
            - **answer** is the actual entry made by the submitter

            Most commonly used **type**s are control_textbox, control_textarea, control_dropdown
            control_radio, control_checkbox, control_fileupload, control_fullname, control_email and control_datetime.[Full List](https://www.jotform.com/help/46-quick-overview-of-form-fields/)
            - **offset** is start of each result set for submission data.
            - **limit** is number of results in each result set for submission data.
            - **orderby** orders results by a submission field name.
            - **filter** filters the query results to fetch a specific submissions range.
            - **count** is total number of results returned by the API
            - **limit-left** is the number of daily api calls you can make.

            Example response from the docs (not valid JSON as published):

            ```json
            {
            "responseCode": 200,
            "message": "success",
            "content": [{
            "id": "237955080346633702",
            "form_id": "31751954731962",
            "ip": "123.123.123.123",
            "created_at": "2013-06-25 03:38:00",
            "updated_at": "2013-06-27 04:58:00",
            "status": "ACTIVE",
            "new": "1",
            "answers": {
            "3": {
            "text": "Name",
            "type":"control_fullname",
            "answer": {
            "first": "Bart",
            "last": "Simpson"
            },
            "prettyFormat": "Bart Simpson"
            },
            "4": {
            "text": "Your Message",
            "type": "control_textarea",
            "answer":"¡Ay, caramba!"
            }
            }],
            "resultSet": {
            "offset": 0,
            "limit": 100,
            "orderby": "id",
            "filter": {
            "new": "1"
            },
            "count": 100
            },
            "limit-left": 9991
            }
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /user/subusers:
    get:
      tags:
      - User
      operationId: userSubusers
      summary: Get Sub-User Account List
      description: Get a list of sub users for this accounts and list of forms and form folders with access privileges.
      externalDocs:
        url: https://api.jotform.com/docs/#user-subusers
      responses:
        '200':
          description: |-
            - **owner** the parent account that created this sub-user.
            - **status** can be LIVE, DELETED or PENDING. If the user has not accepted the invitation sub-user is in PENDING status.
            - **created_at**: YYYY-MM-DD HH:MM:SS
            - **type** can be FORM, FOLDER or ALL.
            - **resource_id** is form ID or folder ID, depending on **type**.
            - **access_type** is full or readOnly. readOnly means form cannot be changed by the sub-user. Only submissions can be viewed.
            - **limit-left** is the number of daily api calls you can make.

            Example response from the docs (not valid JSON as published):

            ```json
            {
            "responseCode": 200,
            "message": "success",
            "content": [{
            "owner": "johnsmith",
            "status": "LIVE",
            "email": "john@example.com",
            "username": "fredsmith",
            "created_at": "2013-06-25 03:38:00",
            "permissions": [{
            "type": "FORM",
            "resource_id": "22911182663957",
            "access_type": "full",
            "title":"Contact Us"
            }],
            "limit-left": 9991
            }
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /user/folders:
    get:
      tags:
      - Folders
      operationId: userFolders
      summary: Get User Folders
      description: 'Get a list of form folders for this account. Returns name of the folder and owner of the folder
        for shared folders. (**IMPORTANT: This endpoint is deprecated. Refer to the ''label'' endpoints section
        for the updated endpoints.**)'
      externalDocs:
        url: https://api.jotform.com/docs/#user-folders
      responses:
        '200':
          description: |-
            - **id** is folder ID.
            - **path** is list of folders above this folder separated with comma.
            - **parent** is the next folder above. If this folder is a root folder parent returns itself.
            - **forms** lists all forms under this folder.
            - **subfolders** lists all folders under this folder.
            - **limit-left** is the number of daily api calls you can make.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                responseCode: 200
                message: success
                content:
                  id: 507eb4d2ceae3f9674000000
                  path: 507eb4d2ceae3f9674000000
                  owner: johnsmith
                  name: Contact Forms
                  parent: 507eb4d2ceae3f9674000000
                  color: rgb(94,94,94)
                  forms:
                    '31504059977966':
                      id: '31504059977966'
                      username: johnsmith
                      title: Contact Us
                      height: '501'
                      status: ENABLED
                      created_at: '2012-12-21 12:12:09'
                      updated_at: '2013-04-12 02:16:44'
                      new: '11'
                      count: '11'
                      source: ''
                      slug: '23554898332968'
                      url: http://form.jotformpro.com/form/31504059977966
                  subfolders:
                  - id: 907eb4d2ceae3f9674000000
                    path: 507eb4d2ceae3f9674000000,907eb4d2ceae3f9674000000
                    owner: johnsmith
                    name: Special Contact Forms
                    parent: 507eb4d2ceae3f9674000000
                    color: rgb(95,95,95)
                    forms: []
                    subfolders: []
                limit-left: 4985
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /user/reports:
    get:
      tags:
      - Reports
      operationId: userReports
      summary: Get User Reports
      description: List of URLS for reports in this account. Includes reports for all of the forms. ie. Excel, CSV,
        printable charts, embeddable HTML tables.
      externalDocs:
        url: https://api.jotform.com/docs/#user-reports
      responses:
        '200':
          description: |-
            - **id** is report ID.
            - **created_at**, **updated_at**: YYYY-MM-DD HH:MM:SS
            - **fields** is a comma separated list of all fields.
            - **list_type** can be excel, csv, grid, table, calendar, rss or visual.
            - **status** can be ENABLED or DELETED
            - **isProtected** is true if password protected
            - **limit-left** is the number of daily api calls you can make.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                responseCode: 200
                message: success
                content:
                - id: '31673586029057'
                  form_id: '31673104360950'
                  title: Report
                  created_at: '2013-06-17 08:11:49'
                  updated_at: '2013-06-17 08:14:49'
                  fields: ip,dt,3,4
                  list_type: excel
                  status: ENABLED
                  url: http://www.jotform.com/excel/31672077425051
                  isProtected: false
                limit-left: 4985
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /user/login:
    post:
      tags:
      - User
      operationId: userLogin
      summary: Login user with given credentials
      externalDocs:
        url: https://api.jotform.com/docs/#user-login
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: User's username
                password:
                  type: string
                  description: User's password
                appName:
                  type: string
                  description: Your application name
                access:
                  type: string
                  description: Full access able to do write operations, but readOnly just for reading operations
              required:
              - username
              - password
      responses:
        '200':
          description: |-
            - **username**, **name**, **email**, **website**, **avatarUrl**, **company**, **industry**, **security question** and **security answer** are basic user account details.
            - **time_zone** is in [IANA format](http://en.wikipedia.org/wiki/List_of_IANA_time_zones).
            - **account_type** list can be seen in [Pricing page](http://www.jotform.com/pricing/).
            - **status** can be ACTIVE, DELETED or SUSPENDED
            - **created_at**, **updated_at**: YYYY-MM-DD HH:MM:SS
            - 1 if you verified your account otherwise 0
            - You should append API Key (or authenticate with header/cookie) to the **usage** URL to get the monthly usage details for a user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                responseCode: 200
                message: success
                content:
                  username: johnsmith
                  name: John Smith
                  email: john@example.com
                  website: http://www.jotform.com
                  time_zone: America/New_York
                  account_type: http://api.jotform.com/system/plan/PREMIUM
                  status: ACTIVE
                  created_at: '2013-06-24 18:43:21'
                  updated_at: '2013-06-25 19:01:52'
                  is_verified: '0'
                  usage: http://api.jotform.com/user/usage
                  industry: ''
                  securityAnswer: ''
                  company: Interlogy, LLC
                  securityQuestion: ''
                  avatarUrl: http://gravatar.com/avatar/c3308f0feb2f350cded9222f83fb9363
                  appKey: APP KEY
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /user/logout:
    get:
      tags:
      - User
      operationId: userLogout
      summary: Logout user
      externalDocs:
        url: https://api.jotform.com/docs/#user-logout
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
