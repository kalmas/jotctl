  /folder/{id}:
    get:
      tags:
      - Folders
      operationId: folderId
      summary: Get Folder Details
      description: 'Get a list of forms in a folder, and other details about the form such as folder color. (**IMPORTANT:
        This endpoint is deprecated. Refer to the ''label'' endpoints section for the updated endpoints.**)'
      externalDocs:
        url: https://api.jotform.com/docs/#folder-id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Folder ID. Get a list of folders from /user/folders
      responses:
        '200':
          description: |-
            - **id** is folder ID.
            - **path** is list of folders above this folder separated with comma.
            - **parent** is the next folder above. If this folder is a root folder parent returns itself.
            - **forms** lists all forms under this folder.
            - **subfolders** lists all folders under this folder.
            - **limit-left** is the number of daily api calls you can make.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                responseCode: 200
                message: success
                content:
                  id: 507eb4d2ceae3f9674000000
                  path: 507eb4d2ceae3f9674000000
                  owner: johnsmith
                  name: Contact Forms
                  parent: 507eb4d2ceae3f9674000000
                  color: rgb(94,94,94)
                  forms:
                    '31504059977966':
                      id: '31504059977966'
                      username: johnsmith
                      title: Contact Us
                      height: '501'
                      status: ENABLED
                      created_at: '2012-12-21 12:12:09'
                      updated_at: '2013-04-12 02:16:44'
                      new: '11'
                      count: '11'
                      source: ''
                      slug: '23554898332968'
                      url: http://form.jotformpro.com/form/31504059977966
                  subfolders:
                  - id: 907eb4d2ceae3f9674000000
                    path: 507eb4d2ceae3f9674000000,907eb4d2ceae3f9674000000
                    owner: johnsmith
                    name: Special Contact Forms
                    parent: 507eb4d2ceae3f9674000000
                    color: rgb(95,95,95)
                    forms: []
                    subfolders: []
                limit-left: 9957
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
    put:
      tags:
      - Folders
      operationId: putFolderId
      summary: Update Folder
      description: 'Update a folder with specified parameters. Also you can add forms to the folder. (**IMPORTANT:
        This endpoint is deprecated. Refer to the ''label'' endpoints section for the updated endpoints.**)'
      externalDocs:
        url: https://api.jotform.com/docs/#put-folder-id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ID of the folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: '`folderContent`: Name, color, parent of the specified folder. Also you can move forms
                to the specified folder.'
      responses:
        '200':
          description: '- **limit-left** is the number of daily api calls you can make.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                responseCode: 200
                message: success
                content:
                  '30693660548966': true
                  color: '#FFFFFF'
                limit-left: 9979
        '404':
          description: Folder not found!
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
    delete:
      tags:
      - Folders
      operationId: deleteFolderId
      summary: Delete Folder
      description: 'Delete a folder and its subfolders. (**IMPORTANT: This endpoint is deprecated. Refer to the
        ''label'' endpoints section for the updated endpoints.**)'
      externalDocs:
        url: https://api.jotform.com/docs/#delete-folder-id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: ID of the folder
      responses:
        '200':
          description: '- **limit-left** is the number of daily api calls you can make.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                responseCode: 200
                message: success
                content: Folder deleted successfully
                limit-left: 9957
  /folder:
    post:
      tags:
      - Folders
      operationId: postFolder
      summary: Create Folder
      description: 'Create a folder with specified parameters. (**IMPORTANT: This endpoint is deprecated. Refer
        to the ''label'' endpoints section for the updated endpoints.**)'
      externalDocs:
        url: https://api.jotform.com/docs/#post-folder
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the folder
                parent:
                  type: string
                  description: Parent id of the folder to be created
                color:
                  type: string
                  description: 'Color of the folder Example: #FFFFFF'
              required:
              - name
      responses:
        '200':
          description: |-
            - **id** is folder ID.
            - **path** is list of folders above this folder separated with comma.
            - **parent** is the next folder above. If this folder is a root folder parent returns itself.
            - **forms** lists all forms under this folder.
            - **limit-left** is the number of daily api calls you can make.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                responseCode: 200
                message: success
                content:
                  id: 507eb4d2ceae3f9674000000
                  path: 507eb4d2ceae3f9674000000
                  owner: johnsmith
                  name: Contact Forms
                  parent: 507eb4d2ceae3f9674000000
                  color: '#26A4E5'
                  forms: null
                limit-left: 9957
        '400':
          description: No folder name supplied!
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /system/plan/{planName}:
    get:
      tags:
      - System
      operationId: systemPlanPlanName
      summary: Get details of a plan
      description: Get limit and prices of a plan.
      externalDocs:
        url: https://api.jotform.com/docs/#system-plan-planName
      parameters:
      - name: planName
        in: path
        required: true
        schema:
          type: string
          description: 'Known values: FREE, BRONZE, SILVER, GOLD, PLATINUM'
        description: Name of the requested plan. FREE, BRONZE etc.
      responses:
        '200':
          description: |-
            - **name** is users account type. Full list can be seen in [Pricing page](http://www.jotform.com/pricing/).
            - Number of **submissions** can be received in a month
            - Number of secure submissions can be received in a month
            - Number of payment submissions can be received in a month
            - Total disk space can be used for uploaded files. In bytes.
            - **api-daily-limit** is the number of daily api calls you can make.
            - **limit-left** is the number of daily api calls you can make.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                responseCode: 200
                message: success
                content:
                  name: FREE
                  limits:
                    submissions: 100
                    overSubmissions: 1000
                    sslSubmissions: 10
                    payments: 10
                    uploads: 104857600
                    tickets: 0
                    subusers: 1
                    api-daily-limit: 1000
                  prices:
                    monthly: 0
                    yearly: 0
                    biyearly: 0
                  plimusIDs:
                    monthly: 0
                    yearly: 0
                    biyearly: 0
                  fastSpringURLs:
                    monthly: ''
                    yearly: ''
                    biyearly: ''
                limit-left: 9962
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: APIKEY
    ApiKeyQuery:
      type: apiKey
      in: query
      name: apiKey
  schemas:
    Envelope:
      type: object
      description: Wrapper around every Jotform API response.
      properties:
        responseCode:
          type: integer
          description: Mirrors the HTTP status (e.g. 200, 401, 404).
        message:
          type: string
          description: '`success`, or an error message.'
        content:
          description: 'The payload: an object or array depending on the endpoint.'
        duration:
          type: string
        resultSet:
          $ref: '#/components/schemas/ResultSet'
        limit-left:
          type: integer
          description: Remaining API calls for today.
      required:
      - responseCode
      - message
    ResultSet:
      type: object
      description: Pagination info for list endpoints.
      properties:
        offset:
          type: integer
        limit:
          type: integer
        orderby:
          type: string
        filter:
          type: string
        count:
          type: integer
          description: Number of results returned.
