            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                responseCode: 200
                message: success
                content:
                  submissionID: SUBMISSION ID
                  URL: http://api.jotform.com/submission/SUBMISSION ID
                limit-left: 9966
        '400':
