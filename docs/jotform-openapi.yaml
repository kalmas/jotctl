# Generated by scripts/gen_openapi.py from https://api.jotform.com/docs/. Unofficial; see info.description.
openapi: 3.0.3
info:
  title: Jotform API
  version: '1'
  description: |-
    Unofficial OpenAPI description of the Jotform REST API, generated on 2026-10-24 by scripts/gen_openapi.py from the official docs at https://api.jotform.com/docs/ (endpoint definitions from the docs' request-models.js, example responses from the docs page). Field types are inferred from the docs and response examples are illustrative; verify against live responses.

    **Authentication:** send your API key in the `APIKEY` header or the `apiKey` query parameter. Get a key at https://www.jotform.com/myaccount/api.

    **Rate limits (requests/day per API key):** Starter 1,000 · Bronze 10,000 · Silver 50,000 · Gold 100,000 · Enterprise unlimited. Each response includes `limit-left`.

    **Filtering:** `filter` takes a JSON object; append `:gt`, `:lt` or `:ne` to a field name for comparisons, e.g. `{"created_at:gt":"2013-01-01 00:00:00"}`.

    **Dates** are strings formatted `YYYY-MM-DD HH:MM:SS`. Numeric values (counts, flags) are generally returned as strings.
externalDocs:
  description: Jotform API documentation
  url: https://api.jotform.com/docs/
