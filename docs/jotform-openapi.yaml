  /form/{id}/submissions:
    get:
      tags:
      - Submissions
      operationId: formIdSubmissions
      summary: Get Form Submissions
      description: List of form responses. **answers** array has the submitted data. Created_at is the date of the
        submission.
      externalDocs:
        url: https://api.jotform.com/docs/#form-id-submissions
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: 'Form ID is the numbers you see on a form URL: https://www.jotformpro.com/form/**30693660548966**.'
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Start of each result set for form list. Useful for pagination. Default is 0.
        example: 20
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Number of results in each result set for form list. Default is 20. Maximum is 1000.
        example: 30
      - name: filter
        in: query
        required: false
        schema:
          type: string
          description: 'JSON-encoded string. Filterable fields: id, form_id, IP, created_at, status, new, flag,
            updated_at, workflowStatus'
        description: |-
          Filters the query results to fetch a specific submissions range.

          Example: {"id:gt":"31974353596870"}
          You can also use gt(greater than), lt(less than), ne(not equal to) commands to get more advanced filtering :
          Example: {"created_at:gt":"2013-01-01 00:00:00"}
          Example: {"workflowStatus:ne":"Approve"}
      - name: orderby
        in: query
        required: false
        schema:
          type: string
          enum:
          - id
          - username
          - title
          - status
          - created_at
          - updated_at
          - new
          - count
          - slug
        description: 'Order results by a form field name: id, username, title, status(ENABLED, DISABLED, DELETED),
          created_at, updated_at, new (unread submissions count), count (all submissions count), slug (used in form
          URL).'
        example: created_at
      responses:
        '200':
          description: |-
            - **id** is the Submission ID
            - **ip** address of the submitter
            - **created_at**, **updated_at**: YYYY-MM-DD HH:MM:SS
            - **status** can be ACTIVE or OVERQUOTA
            - **new** is 1 if this submission is not read
            - **text** is the question label on the form
            - **type** is the question type such as textbox or dropdown
            - **answer** is the actual entry made by the submitter

            Most commonly used **type**s are control_textbox, control_textarea, control_dropdown
            control_radio, control_checkbox, control_fileupload, control_fullname, control_email and control_datetime.[Full List](https://www.jotform.com/help/46-quick-overview-of-form-fields/)
            - **workflowStatus** has only shown if the form is connected to any workflow.
            - **limit-left** is the number of daily api calls you can make.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                responseCode: 200
                message: success
                content:
                - id: '237955080346633702'
                  form_id: '31751954731962'
                  ip: 123.123.123.123
                  created_at: '2013-06-25 03:38:00'
                  updated_at: '2013-06-27 04:58:00'
                  status: ACTIVE
                  new: '1'
                  answers:
                    '3':
                      text: Name
                      type: control_fullname
                      answer:
                        first: Bart
                        last: Simpson
                      prettyFormat: Bart Simpson
                    '4':
                      text: Your Message
                      type: control_textarea
                      answer: ¡Ay, caramba!
                  workflowStatus: Approve
                limit-left: 9991
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
    post:
      tags:
      - Submissions
      operationId: postFormIdSubmissions
      summary: Add a Submission to the Form
      description: Submit data to this form using the API. You should get a list of question IDs from form/{id}/questions
        and send the submission data with qid.
      externalDocs:
        url: https://api.jotform.com/docs/#post-form-id-submissions
      parameters:
      - name: id
        in: path
        required: true
